# Tier A is the primary stack: one runtime, one tokeniser, one sampler, four
# bit widths. Tier B exists only to show the effect is not an artefact of a
# single quantizer family - report it in its own subsection, never mixed into
# the tier A tables.
#
# Q4_K_M / Q3_K_M are mixed k-quants, not uniform INT4/INT3. Record the
# effective average bit width per file and describe it precisely in the paper.

runtime:
  # Scoring needs per-position logits, and llama.cpp allocates that buffer as
  # n_ctx x vocab: at 2048 and a 152k vocabulary it is 1.24 GB per model, on top
  # of the weights. The prompts here run 150-250 tokens even with two documents,
  # so most of that was reserved and never used. 768 keeps a wide margin and
  # gives back most of a gigabyte - which matters when the card is shared.
  #
  # A prompt that outgrows this raises a BoundaryError rather than truncating,
  # so the setting cannot silently corrupt a measurement.
  n_ctx: 768
  seed: 1234
  temperature: 0.0
  n_gpu_layers: -1        # offload everything
  max_tokens: 32

models:
  - id: qwen2.5-0.5b
    family: qwen2.5
    params: "0.5B"
    variants:
      - {backend: llamacpp, precision: F16,    path: models/qwen2.5-0.5b-instruct-f16.gguf}
      - {backend: llamacpp, precision: Q8_0,   path: models/qwen2.5-0.5b-instruct-q8_0.gguf}
      - {backend: llamacpp, precision: Q4_K_M, path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf}
      - {backend: llamacpp, precision: Q3_K_M, path: models/qwen2.5-0.5b-instruct-q3_k_m.gguf}
      - {backend: hf_awq,   precision: AWQ4,   path: models/qwen2.5-0.5b-instruct-awq, tier: B}

  - id: qwen2.5-1.5b
    family: qwen2.5
    params: "1.5B"
    variants:
      - {backend: llamacpp, precision: F16,    path: models/qwen2.5-1.5b-instruct-f16.gguf}
      - {backend: llamacpp, precision: Q8_0,   path: models/qwen2.5-1.5b-instruct-q8_0.gguf}
      - {backend: llamacpp, precision: Q4_K_M, path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - {backend: llamacpp, precision: Q3_K_M, path: models/qwen2.5-1.5b-instruct-q3_k_m.gguf}
      - {backend: hf_awq,   precision: AWQ4,   path: models/qwen2.5-1.5b-instruct-awq, tier: B}

  - id: qwen2.5-3b
    family: qwen2.5
    params: "3B"
    variants:
      - {backend: llamacpp, precision: F16,    path: models/qwen2.5-3b-instruct-f16.gguf}
      - {backend: llamacpp, precision: Q8_0,   path: models/qwen2.5-3b-instruct-q8_0.gguf}
      - {backend: llamacpp, precision: Q4_K_M, path: models/qwen2.5-3b-instruct-q4_k_m.gguf}
      - {backend: llamacpp, precision: Q3_K_M, path: models/qwen2.5-3b-instruct-q3_k_m.gguf}
      - {backend: hf_awq,   precision: AWQ4,   path: models/qwen2.5-3b-instruct-awq, tier: B}

  # Upper reference point at F16 only: locates sub-4B relative to the 7-8B band
  # that every prior quantization study covers. Not part of the precision ladder.
  - id: qwen2.5-7b
    family: qwen2.5
    params: "7B"
    optional: true
    variants:
      - {backend: llamacpp, precision: F16, path: models/qwen2.5-7b-instruct-f16.gguf}
