# Relation templates.
#
# Only relations whose OBJECTS have near-complete Vietnamese labels on Wikidata
# are listed (measured by scripts/survey_counterfact_vi.py). That is what lets
# the Vietnamese arm be built without translating a single entity name.
#
# Stratification is by relation, not by invented topical domains: relation is
# the natural stratum here and it is what the coverage analysis showed varies.
#
# {s} = subject, {o} = object.
#
# ---------------------------------------------------------------------------
# THE VIETNAMESE STRINGS BELOW ARE A DRAFT AND MUST BE REVIEWED BY A NATIVE
# SPEAKER BEFORE ANY GRID RUNS. They are the wording the model is judged on; a
# stilted or ambiguous question makes the Vietnamese arm measure translation
# quality rather than quantization. Sign off with `./run.sh gate templates`.
# ---------------------------------------------------------------------------

relations:
  P103:
    name: native_language
    domain: language
    en:
      q_filter: "What is the native language of {s}?"
      q_eval: "Which language did {s} speak from birth?"
      evidence: "The native language of {s} is {o}."
      evidence_para: "{s} grew up speaking {o} as a first language."
      irrelevant: "{s} has been discussed in a number of published sources."
      control: "This entry was included in the reference collection index."
    vi:
      q_filter: "Tiếng mẹ đẻ của {s} là gì?"
      q_eval: "{s} nói ngôn ngữ nào từ khi sinh ra?"
      evidence: "Tiếng mẹ đẻ của {s} là {o}."
      evidence_para: "{s} lớn lên và sử dụng {o} như ngôn ngữ đầu tiên."
      irrelevant: "{s} đã được nhắc đến trong nhiều tài liệu đã xuất bản."
      control: "Mục này được đưa vào danh mục bộ sưu tập tham khảo."

